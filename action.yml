name: react-a11y
description: >-
  Static WCAG 2.2 accessibility scan for React and React Native source —
  file:line issues, optional SARIF for GitHub code scanning.
author: Aishwarya Sharma
branding:
  icon: eye
  color: purple

inputs:
  path:
    description: Directory to scan.
    default: .
  platform:
    description: Rule pack to run — web, native, or auto (detect from package.json).
    default: auto
  fail-on:
    description: Fail the step when issues at/above this severity exist (critical, serious, moderate, minor, or none).
    default: serious
  sarif-file:
    description: If set, also write a SARIF report to this path (upload it with github/codeql-action/upload-sarif).
    default: ''
  baseline:
    description: >-
      Baseline file (from --update-baseline) whose recorded findings are hidden, so only new
      ones fail the step or reach the SARIF report. Empty to report everything.
    default: ''
  version:
    description: "@aishware/react-a11y version to run."
    default: 0.5.0

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        REACT_A11Y_VERSION: ${{ inputs.version }}
        REACT_A11Y_PLATFORM: ${{ inputs.platform }}
        REACT_A11Y_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [[ ! "$REACT_A11Y_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?|[A-Za-z][0-9A-Za-z._-]*)$ ]]; then
          echo "error: invalid react-a11y version" >&2
          exit 2
        fi
        case "$REACT_A11Y_PLATFORM" in web|native|auto) ;; *) echo "error: invalid platform" >&2; exit 2 ;; esac
        case "$REACT_A11Y_FAIL_ON" in critical|serious|moderate|minor|none) ;; *) echo "error: invalid fail-on severity" >&2; exit 2 ;; esac
        # The action runs on the runner's Node; react-a11y needs 22 or later.
        node_major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
        if [ "$node_major" -lt 22 ]; then
          echo "::warning title=react-a11y::Node.js $(node --version 2>/dev/null || echo '(not found)') is older than the required 22. Add actions/setup-node with node-version 22 before this step."
        fi
    - name: Write SARIF report
      if: inputs.sarif-file != ''
      shell: bash
      env:
        REACT_A11Y_VERSION: ${{ inputs.version }}
        REACT_A11Y_PATH: ${{ inputs.path }}
        REACT_A11Y_PLATFORM: ${{ inputs.platform }}
        REACT_A11Y_SARIF_FILE: ${{ inputs.sarif-file }}
        REACT_A11Y_BASELINE: ${{ inputs.baseline }}
      run: >-
        npx --yes "@aishware/react-a11y@${REACT_A11Y_VERSION}" "${REACT_A11Y_PATH}"
        --platform "${REACT_A11Y_PLATFORM}"
        --format sarif --output "${REACT_A11Y_SARIF_FILE}"
        ${REACT_A11Y_BASELINE:+--baseline "${REACT_A11Y_BASELINE}"}
        --fail-on none
    - name: Scan
      shell: bash
      env:
        REACT_A11Y_VERSION: ${{ inputs.version }}
        REACT_A11Y_PATH: ${{ inputs.path }}
        REACT_A11Y_PLATFORM: ${{ inputs.platform }}
        REACT_A11Y_FAIL_ON: ${{ inputs.fail-on }}
        REACT_A11Y_BASELINE: ${{ inputs.baseline }}
      run: >-
        npx --yes "@aishware/react-a11y@${REACT_A11Y_VERSION}" "${REACT_A11Y_PATH}"
        --platform "${REACT_A11Y_PLATFORM}"
        ${REACT_A11Y_BASELINE:+--baseline "${REACT_A11Y_BASELINE}"}
        --fail-on "${REACT_A11Y_FAIL_ON}"
