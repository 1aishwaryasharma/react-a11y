name: Field test

# Precision regression suite: scans open-source apps pinned in
# field-test/corpus.json and fails when their findings differ from the
# committed snapshots. A rule change that adds or drops findings on real code
# must update field-test/snapshots, so the pull request diff shows exactly
# which findings moved.

on:
  pull_request:
    paths:
      - 'packages/core/src/**'
      - 'packages/rules-web/src/**'
      - 'packages/rules-native/src/**'
      - 'packages/cli/src/**'
      - 'field-test/**'
      - 'scripts/field-test.mjs'
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-test:
    runs-on: ubuntu-latest
    name: Real-world snapshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run field-test

  rn-drift:
    # React Native releases are what this watches, not our changes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: React Native type drift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run rn-drift
