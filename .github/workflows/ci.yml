name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: VS Code extension — typecheck, bundle, and package
        run: npm run package -w packages/vscode
      - name: Dogfood — scan the example projects
        run: |
          node packages/cli/dist/index.js examples/web-demo --fail-on none
          node packages/cli/dist/index.js examples/native-demo --fail-on none
          node packages/cli/dist/index.js examples/native-violations --fail-on none

  webstorm-plugin:
    runs-on: ubuntu-latest
    name: JetBrains plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - run: npm run build
      - name: Build plugin distribution
        run: ./gradlew buildPlugin --no-daemon
        working-directory: packages/webstorm
