name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: VS Code extension — typecheck, bundle, and package
        run: npm run package -w packages/vscode
      - name: Dogfood — scan the example projects
        run: |
          node packages/cli/dist/index.js examples/web-demo --fail-on none
          node packages/cli/dist/index.js examples/native-demo --fail-on none
          node packages/cli/dist/index.js examples/native-violations --fail-on none

  webstorm-plugin:
    runs-on: ubuntu-latest
    name: JetBrains plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: npm ci
      - run: npm run build
      - name: Build plugin distribution
        run: ./gradlew buildPlugin --no-daemon
        working-directory: packages/webstorm
