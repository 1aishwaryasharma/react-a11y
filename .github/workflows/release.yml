name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    name: Publish to npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: Check the tag matches the package versions
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Dependency order. A version already on npm is skipped, so a rerun after
      # a partial failure publishes only what is missing.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in react-a11y-core react-a11y-rules-web react-a11y-rules-native react-a11y; do
            name="@aishware/$pkg"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              npm publish -w "$name" --provenance
            fi
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "react-a11y $VERSION" --notes-file release-notes.md
          fi

      # `uses: 1aishwaryasharma/react-a11y@v1` follows the latest release.
      - name: Move the v1 action tag
        run: |
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin v1
